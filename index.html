<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050708">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ScoutTrace">
    <meta name="application-name" content="Acelynn's ScoutTrace™">
    <title>Acelynn's ScoutTrace™</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="scouttrace-icon.svg" type="image/svg+xml">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .ios-blur {
            background: rgba(20, 20, 25, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .neon-glow-cyan {
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.15);
        }
        .pulse-red {
            animation: pulse 1.5s infinite alternate;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.2); }
            100% { box-shadow: 0 0 25px rgba(239, 68, 68, 0.6); }
        }
        #splash-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
            background:
                radial-gradient(circle at 50% 35%, rgba(34, 211, 238, 0.13), transparent 34%),
                radial-gradient(circle at 50% 72%, rgba(20, 184, 166, 0.08), transparent 30%),
                linear-gradient(180deg, #020405 0%, #050708 55%, #020304 100%);
            overflow: hidden;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.55s ease, visibility 0.55s ease;
        }
        #splash-screen::before {
            content: "";
            position: absolute;
            inset: -20%;
            background-image:
                linear-gradient(rgba(34, 211, 238, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34, 211, 238, 0.035) 1px, transparent 1px);
            background-size: 38px 38px;
            transform: perspective(520px) rotateX(68deg) translateY(28%);
            transform-origin: center bottom;
            mask-image: linear-gradient(to bottom, transparent 20%, black 70%, transparent 100%);
            pointer-events: none;
        }
        #splash-screen.splash-hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .studio-mark {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 34px;
        }
        .studio-name {
            color: #f5f7f8;
            font-size: clamp(2rem, 9vw, 3.35rem);
            line-height: 1;
            font-weight: 900;
            letter-spacing: -0.06em;
            text-shadow: 0 0 28px rgba(34, 211, 238, 0.14);
        }
        .studio-name .cactus {
            display: inline-block;
            margin: 0 0.04em;
            filter: drop-shadow(0 0 9px rgba(45, 212, 191, 0.28));
            transform-origin: 50% 85%;
            animation: cactusPulse 1.7s ease-in-out infinite alternate;
        }
        .studio-sub {
            margin-top: 9px;
            color: #7d8a90;
            font-size: 0.78rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.36em;
            padding-left: 0.36em;
        }
        .app-lockup {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .app-icon-shell {
            position: relative;
            width: 150px;
            height: 150px;
            display: grid;
            place-items: center;
            border-radius: 40px;
            background: rgba(8, 15, 18, 0.72);
            border: 1px solid rgba(103, 232, 249, 0.14);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.025) inset,
                0 26px 70px rgba(0,0,0,0.58),
                0 0 55px rgba(34, 211, 238, 0.12);
            animation: iconFloat 2.1s ease-in-out infinite alternate;
        }
        .app-icon-shell::after {
            content: "";
            position: absolute;
            inset: -17px;
            border: 1px dashed rgba(34, 211, 238, 0.17);
            border-radius: 50%;
            animation: radarSpin 9s linear infinite;
        }
        .app-icon-shell img {
            width: 126px;
            height: 126px;
            display: block;
        }
        .app-name {
            margin-top: 30px;
            color: #f7fafb;
            font-size: clamp(1.45rem, 6.5vw, 2rem);
            line-height: 1.1;
            font-weight: 900;
            letter-spacing: -0.035em;
        }
        .app-name span {
            color: #67e8f9;
        }
        .app-tagline {
            margin-top: 8px;
            color: #64747a;
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.25em;
            text-transform: uppercase;
        }
        .splash-trace {
            width: min(280px, 72vw);
            height: 2px;
            margin-top: 28px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(103, 232, 249, 0.09);
        }
        .splash-trace::after {
            content: "";
            display: block;
            width: 42%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, transparent, #67e8f9, #2dd4bf, transparent);
            animation: traceScan 1.35s ease-in-out infinite;
        }
        @keyframes radarSpin { to { transform: rotate(360deg); } }
        @keyframes iconFloat { from { transform: translateY(2px) scale(0.985); } to { transform: translateY(-5px) scale(1); } }
        @keyframes cactusPulse { from { transform: scale(0.97); } to { transform: scale(1.04); } }
        @keyframes traceScan { from { transform: translateX(-120%); } to { transform: translateX(340%); } }
        @media (prefers-reduced-motion: reduce) {
            .studio-name .cactus,
            .app-icon-shell,
            .app-icon-shell::after,
            .splash-trace::after { animation: none !important; }
        }
    </style>
</head>
<body class="text-gray-100 flex flex-col justify-between min-h-screen p-6 select-none overflow-hidden">

    <div id="splash-screen" aria-label="Acelynn's ScoutTrace launching">
        <div class="studio-mark">
            <div class="studio-name">Cactus<span class="cactus">🌵</span>Byte</div>
            <div class="studio-sub">Studios™</div>
        </div>

        <div class="app-lockup">
            <div class="app-icon-shell">
                <img src="scouttrace-icon.svg" alt="Acelynn's ScoutTrace logo">
            </div>
            <div class="app-name">Acelynn's <span>ScoutTrace™</span></div>
            <div class="app-tagline">Signal Intelligence</div>
            <div class="splash-trace" aria-hidden="true"></div>
        </div>
    </div>

    <!-- Top Status Bar Area -->
    <header class="w-full flex justify-between items-center pt-2">
        <div>
            <h1 class="text-xs font-bold uppercase tracking-widest text-zinc-500">Signal Intelligence</h1>
            <p class="text-2xl font-black text-white tracking-tight">Ace's Little Eye</p>
        </div>
        <div id="status-tag" class="px-3 py-1 rounded-full text-xs font-semibold bg-zinc-900 border border-zinc-800 text-zinc-400">
            SYSTEM READY
        </div>
    </header>

    <!-- Main Visualizer Container -->
    <main class="flex-1 flex flex-col justify-center items-center my-6 w-full">
        <!-- iOS Style Circular Gauge -->
        <div id="gauge-container" class="w-64 h-64 rounded-full ios-blur flex flex-col justify-center items-center relative transition-all duration-300 neon-glow-cyan">
            <!-- Decorative Inner Radar Ring -->
            <div class="absolute inset-4 rounded-full border border-dashed border-zinc-800/60 animate-[spin_20s_linear_infinite]"></div>
            
            <span class="text-xs font-medium tracking-widest text-cyan-400 uppercase mb-1 z-10">EMF Intensity</span>
            <span id="emf-value" class="text-6xl font-light font-mono tracking-tighter text-white z-10">0.00</span>
            <span class="text-xs font-bold text-zinc-500 mt-1 z-10">µT (Microtesla)</span>
        </div>

        <!-- Real-time Waveform Canvas -->
        <div class="w-full max-w-sm mt-8 ios-blur rounded-2xl p-4 h-24 relative overflow-hidden">
            <canvas id="waveform" class="w-full h-full opacity-80"></canvas>
        </div>
    </main>

    <!-- Bottom Interface Controls -->
    <footer class="w-full max-w-sm mx-auto space-y-4 pb-4">
        <!-- Calibration Info Banner -->
        <div class="ios-blur rounded-xl p-3 text-center text-xs text-zinc-400">
            <span class="text-cyan-400 font-semibold">Android Hardware Alert:</span> Sweep phone slowly near walls, outlets, or frames to detect anomalies.
        </div>

        <!-- Native Access Request Trigger Button -->
        <button id="start-btn" class="w-full py-4 rounded-2xl font-semibold tracking-wide text-black bg-gradient-to-r from-cyan-400 to-emerald-400 active:scale-[0.98] transition-transform duration-100 shadow-lg shadow-cyan-500/20">
            Initialize Sensor Array
        </button>
    </footer>

    <!-- Core Script Execution -->
    <script>
        const splashScreen = document.getElementById('splash-screen');
        const startBtn = document.getElementById('start-btn');
        const emfValue = document.getElementById('emf-value');
        const statusTag = document.getElementById('status-tag');
        const gaugeContainer = document.getElementById('gauge-container');
        const canvas = document.getElementById('waveform');
        const ctx = canvas.getContext('2d');

        let dataPoints = new Array(50).fill(0);
        let animationFrameId;
        let isScanning = false;

        window.addEventListener('DOMContentLoaded', () => {
            window.setTimeout(() => {
                if (splashScreen) splashScreen.classList.add('splash-hide');
            }, 1550);
            window.setTimeout(() => {
                if (splashScreen) splashScreen.remove();
            }, 2200);
        });

        // Scale canvas for crisp pixel rendering on mobile high-DPI displays
        function setupCanvas() {
            canvas.width = canvas.clientWidth * window.devicePixelRatio;
            canvas.height = canvas.clientHeight * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }

        function drawWaveform() {
            ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
            ctx.strokeStyle = isScanning ? '#22d3ee' : '#27272a';
            ctx.lineWidth = 2.5;
            ctx.beginPath();

            const step = canvas.clientWidth / (dataPoints.length - 1);
            for (let i = 0; i < dataPoints.length; i++) {
                const x = i * step;
                const y = (canvas.clientHeight / 2) - (dataPoints[i] * 0.5);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            animationFrameId = requestAnimationFrame(drawWaveform);
        }

        function handleMotion(event) {
            if (!isScanning) return;

            const x = event.accelerationIncludingGravity.x || 0;
            const y = event.accelerationIncludingGravity.y || 0;
            const z = event.accelerationIncludingGravity.z || 0;
            let magnitude = Math.sqrt(x*x + y*y + z*z) * 4.2; 
            magnitude += (Math.random() * 1.5);

            emfValue.innerText = magnitude.toFixed(2);
            dataPoints.push(magnitude);
            dataPoints.shift();

            if (magnitude > 55) {
                statusTag.innerText = "THREAT DETECTED";
                statusTag.className = "px-3 py-1 rounded-full text-xs font-semibold bg-red-950/50 border border-red-500 text-red-400";
                gaugeContainer.className = "w-64 h-64 rounded-full ios-blur flex flex-col justify-center items-center relative transition-all duration-300 pulse-red";
                if (navigator.vibrate) navigator.vibrate(60);
            } else {
                statusTag.innerText = "SCANNING LIVE";
                statusTag.className = "px-3 py-1 rounded-full text-xs font-semibold bg-cyan-950/50 border border-cyan-500 text-cyan-400";
                gaugeContainer.className = "w-64 h-64 rounded-full ios-blur flex flex-col justify-center items-center relative transition-all duration-300 neon-glow-cyan";
            }
        }

        startBtn.addEventListener('click', async () => {
            if (isScanning) {
                isScanning = false;
                window.removeEventListener('devicemotion', handleMotion);
                startBtn.innerText = "Initialize Sensor Array";
                startBtn.className = "w-full py-4 rounded-2xl font-semibold tracking-wide text-black bg-gradient-to-r from-cyan-400 to-emerald-400 active:scale-[0.98] transition-transform duration-100";
                statusTag.innerText = "SYSTEM READY";
                statusTag.className = "px-3 py-1 rounded-full text-xs font-semibold bg-zinc-900 border border-zinc-800 text-zinc-400";
                return;
            }

            setupCanvas();
            
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceMotionEvent.requestPermission();
                    if (permissionState === 'granted') {
                        executeCapture();
                    } else {
                        alert('Hardware permission denied.');
                    }
                } catch (error) {
                    console.error(error);
                }
            } else {
                executeCapture();
            }
        });

        function executeCapture() {
            isScanning = true;
            window.addEventListener('devicemotion', handleMotion, true);
            startBtn.innerText = "Terminate Scan";
            startBtn.className = "w-full py-4 rounded-2xl font-semibold tracking-wide text-white bg-zinc-900 border border-zinc-800 active:scale-[0.98] transition-transform duration-100";
            drawWaveform();
        }

        window.addEventListener('resize', setupCanvas);
        setupCanvas();
        drawWaveform();
    </script>
</body>
</html>
