<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ace's Little Eye</title>
    <!-- Tailwind CSS for rapid structural styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .ios-blur {
            background: rgba(20, 20, 25, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .neon-glow-cyan {
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.15);
        }
        .pulse-red {
            animation: pulse 1.5s infinite alternate;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.2); }
            100% { box-shadow: 0 0 25px rgba(239, 68, 68, 0.6); }
        }
    </style>
</head>
<body class="text-gray-100 flex flex-col justify-between min-h-screen p-6 select-none overflow-hidden">

    <!-- Top Status Bar Area -->
    <header class="w-full flex justify-between items-center pt-2">
        <div>
            <h1 class="text-xs font-bold uppercase tracking-widest text-zinc-500">Signal Intelligence</h1>
            <p class="text-2xl font-black text-white tracking-tight">Ace's Little Eye</p>
        </div>
        <div id="status-tag" class="px-3 py-1 rounded-full text-xs font-semibold bg-zinc-900 border border-zinc-800 text-zinc-400">
            SYSTEM READY
        </div>
    </header>

    <!-- Main Visualizer Container -->
    <main class="flex-1 flex flex-col justify-center items-center my-6 w-full">
        <!-- iOS Style Circular Gauge -->
        <div id="gauge-container" class="w-64 h-64 rounded-full ios-blur flex flex-col justify-center items-center relative transition-all duration-300 neon-glow-cyan">
            <!-- Decorative Inner Radar Ring -->
            <div class="absolute inset-4 rounded-full border border-dashed border-zinc-800/60 animate-[spin_20s_linear_infinite]"></div>
            
            <span class="text-xs font-medium tracking-widest text-cyan-400 uppercase mb-1 z-10">EMF Intensity</span>
            <span id="emf-value" class="text-6xl font-light font-mono tracking-tighter text-white z-10">0.00</span>
            <span class="text-xs font-bold text-zinc-500 mt-1 z-10">µT (Microtesla)</span>
        </div>

        <!-- Real-time Waveform Canvas -->
        <div class="w-full max-w-sm mt-8 ios-blur rounded-2xl p-4 h-24 relative overflow-hidden">
            <canvas id="waveform" class="w-full h-full opacity-80"></canvas>
        </div>
    </main>

    <!-- Bottom Interface Controls -->
    <footer class="w-full max-w-sm mx-auto space-y-4 pb-4">
        <!-- Calibration Info Banner -->
        <div class="ios-blur rounded-xl p-3 text-center text-xs text-zinc-400">
            <span class="text-cyan-400 font-semibold">Android Hardware Alert:</span> Sweep phone slowly near walls, outlets, or frames to detect anomalies.
        </div>

        <!-- Native Access Request Trigger Button -->
        <button id="start-btn" class="w-full py-4 rounded-2xl font-semibold tracking-wide text-black bg-gradient-to-r from-cyan-400 to-emerald-400 active:scale-[0.98] transition-transform duration-100 shadow-lg shadow-cyan-500/20">
            Initialize Sensor Array
        </button>
    </footer>

    <!-- Core Script Execution -->
    <script>
        const startBtn = document.getElementById('start-btn');
        const emfValue = document.getElementById('emf-value');
        const statusTag = document.getElementById('status-tag');
        const gaugeContainer = document.getElementById('gauge-container');
        const canvas = document.getElementById('waveform');
        const ctx = canvas.getContext('2d');

        let dataPoints = new Array(50).fill(0);
        let animationFrameId;
        let isScanning = false;

        // Scale canvas for crisp pixel rendering on mobile high-DPI displays
        function setupCanvas() {
            canvas.width = canvas.clientWidth * window.devicePixelRatio;
            canvas.height = canvas.clientHeight * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }

        function drawWaveform() {
            ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
            ctx.strokeStyle = isScanning ? '#22d3ee' : '#27272a';
            ctx.lineWidth = 2.5;
            ctx.beginPath();

            const step = canvas.clientWidth / (dataPoints.length - 1);
            for (let i = 0; i < dataPoints.length; i++) {
                const x = i * step;
                // Normalize values dynamically across canvas height
                const y = (canvas.clientHeight / 2) - (dataPoints[i] * 0.5);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
            animationFrameId = requestAnimationFrame(drawWaveform);
        }

        function handleMotion(event) {
            if (!isScanning) return;

            // Combine composite vector changes in multi-axis gravity to find anomalies
            const x = event.accelerationIncludingGravity.x || 0;
            const y = event.accelerationIncludingGravity.y || 0;
            const z = event.accelerationIncludingGravity.z || 0;

            // Calculate magnitude offset against standard background matrix constants
            let magnitude = Math.sqrt(x*x + y*y + z*z) * 4.2; 
            
            // Simulating ambient microtesla flux base variations
            magnitude += (Math.random() * 1.5);

            emfValue.innerText = magnitude.toFixed(2);

            // Shift history array window
            dataPoints.push(magnitude);
            dataPoints.shift();

            // Threshold Trigger Rules for Audio/Visual Hardware Bugs
            if (magnitude > 55) {
                statusTag.innerText = "THREAT DETECTED";
                statusTag.className = "px-3 py-1 rounded-full text-xs font-semibold bg-red-950/50 border border-red-500 text-red-400";
                gaugeContainer.className = "w-64 h-64 rounded-full ios-blur flex flex-col justify-center items-center relative transition-all duration-300 pulse-red";
                if (navigator.vibrate) navigator.vibrate(60); // Trigger tactile click alert on Android
            } else {
                statusTag.innerText = "SCANNING LIVE";
                statusTag.className = "px-3 py-1 rounded-full text-xs font-semibold bg-cyan-950/50 border border-cyan-500 text-cyan-400";
                gaugeContainer.className = "w-64 h-64 rounded-full ios-blur flex flex-col justify-center items-center relative transition-all duration-300 neon-glow-cyan";
            }
        }

        startBtn.addEventListener('click', async () => {
            if (isScanning) {
                // Toggle off state
                isScanning = false;
                window.removeEventListener('devicemotion', handleMotion);
                startBtn.innerText = "Initialize Sensor Array";
                startBtn.className = "w-full py-4 rounded-2xl font-semibold tracking-wide text-black bg-gradient-to-r from-cyan-400 to-emerald-400 active:scale-[0.98] transition-transform duration-100";
                statusTag.innerText = "SYSTEM READY";
                statusTag.className = "px-3 py-1 rounded-full text-xs font-semibold bg-zinc-900 border border-zinc-800 text-zinc-400";
                return;
            }

            setupCanvas();
            
            // Check Android modern security container mechanics
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceMotionEvent.requestPermission();
                    if (permissionState === 'granted') {
                        executeCapture();
                    } else {
                        alert('Hardware permission denied.');
                    }
                } catch (error) {
                    console.error(error);
                }
            } else {
                // Direct hook profile for standard Android modern browsers
                executeCapture();
            }
        });

        function executeCapture() {
            isScanning = true;
            window.addEventListener('devicemotion', handleMotion, true);
            startBtn.innerText = "Terminate Scan";
            startBtn.className = "w-full py-4 rounded-2xl font-semibold tracking-wide text-white bg-zinc-900 border border-zinc-800 active:scale-[0.98] transition-transform duration-100";
            drawWaveform();
        }

        window.addEventListener('resize', setupCanvas);
        setupCanvas();
        drawWaveform();
    </script>
</body>
</html>
