name: ScoutTrace Signing Cutover Recovery QA

on:
  push:
    branches: [android-signing-cutover-data-recovery]
    paths:
      - 'index.html'
      - 'raw-index.html'
      - 'scouttrace-recovery.js'
      - 'api/demo-shell.js'
      - 'tools/apply-signing-cutover-data-recovery.py'
      - 'tools/qa-signing-cutover-data-recovery.mjs'
      - '.github/workflows/signing-cutover-data-recovery.yml'
      - 'vercel.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recovery:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v5
        with:
          ref: android-signing-cutover-data-recovery
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply deterministic recovery patch
        run: python tools/apply-signing-cutover-data-recovery.py
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Run recovery functional and source QA
        run: node tools/qa-signing-cutover-data-recovery.mjs
      - name: Syntax-check JavaScript
        run: |
          node --check scouttrace-recovery.js
          node --check api/demo-shell.js
          python - <<'PY'
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          marker='<script>\n(()=>'
          start=text.index(marker)+len('<script>\n')
          end=text.index('</script>',start)
          Path('/tmp/scouttrace-inline.js').write_text(text[start:end],encoding='utf-8')
          PY
          node --check /tmp/scouttrace-inline.js
      - name: Verify deployment boundary
        run: |
          grep -Eq '"deploymentEnabled"[[:space:]]*:[[:space:]]*false' vercel.json
          test ! -d .vercel/output
          echo 'No Vercel deployment executed by this workflow.'
      - name: Commit deterministic recovery source if needed
        shell: bash
        run: |
          git add index.html raw-index.html
          if git diff --cached --quiet; then
            echo 'Generated ScoutTrace recovery source already settled.'
            exit 0
          fi
          changed="$(git diff --cached --name-only | sort)"
          expected=$'index.html\nraw-index.html'
          test "$changed" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'recovery: apply ScoutTrace history backup UI'
          git push origin HEAD:android-signing-cutover-data-recovery
