name: Build ScoutTrace Android

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build installable debug APK
        working-directory: android
        run: gradle :app:assemblePlayDebug --stacktrace
      - name: Build release bundle
        working-directory: android
        run: gradle :app:bundlePlayRelease --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Acelynns-ScoutTrace-v2.1.0-APK
          path: android/app/build/outputs/apk/play/debug/app-play-debug.apk
          if-no-files-found: error
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Acelynns-ScoutTrace-v2.1.0-AAB-unsigned
          path: android/app/build/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error
